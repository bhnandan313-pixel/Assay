[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "assay-runtime"
version = "0.1.0"
description = "The Verification Runtime for Agent-Written Code"
readme = "README.md"
license = { text = "Apache-2.0" }
requires-python = ">=3.11"
authors = [
    { name = "Assay Contributors" }
]
classifiers = [
    "Development Status :: 3 - Alpha",
    "Intended Audience :: Developers",
    "License :: OSI Approved :: Apache Software License",
    "Programming Language :: Python :: 3.11",
    "Topic :: Software Development :: Testing",
]

dependencies = [
    "typer[all]>=0.9.0",
    "pydantic>=2.6.0",
    "pydantic-settings>=2.1.0",
    "httpx>=0.27.0",
    "aiohttp>=3.9.0",
    "deepdiff>=6.7.0",
    "cryptography>=42.0.0",
    "rich>=13.7.0",
    "pyyaml>=6.0.1",
    "playwright>=1.42.0",
]

[project.optional-dependencies]
demo = [
    "fastapi>=0.110.0",
    "uvicorn>=0.27.0",
]
dev = [
    "pytest>=8.0.0",
    "pytest-asyncio>=0.23.0",
    "pytest-mock>=3.12.0",
    "respx>=0.21.0",
    "ruff>=0.2.0",
    "fastapi>=0.110.0",
    "uvicorn>=0.27.0",
]

[project.scripts]
assay = "assay.cli.main:app"

[tool.hatch.build.targets.wheel]
packages = ["src/assay"]

[tool.pytest.ini_options]
asyncio_mode = "auto"
asyncio_default_fixture_loop_scope = "function"
testpaths = ["tests"]

[tool.ruff]
target-version = "py311"
line-length = 100

[tool.ruff.lint]
select = ["E", "F", "I", "W"]
